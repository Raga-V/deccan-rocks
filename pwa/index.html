<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a2420">
  <title>Deccan Rocks</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="top">
    <h1 id="title">Your rocks</h1>
    <span id="net" class="pill">…</span>
  </header>
  <div id="banner" hidden></div>
  <button id="toast" hidden></button>
  <main id="main"></main>
  <nav class="tabs">
    <button data-view="rocks">🪨<span>Rocks</span></button>
    <button data-view="visit">📷<span>Visit</span></button>
    <button data-view="inbox">✉️<span>Inbox</span><i id="inbox-badge" hidden></i></button>
    <button data-view="home">🏠<span>Home</span></button>
  </nav>
  <input id="camera" type="file" accept="image/*" capture="environment" hidden>
  <audio id="player" preload="auto"></audio>
</body>
</html>
